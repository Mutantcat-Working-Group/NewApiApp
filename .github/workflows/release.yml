name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  build-desktop:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: nsis
            pattern: '*.exe'
            asset: windows-x86_64
          - os: macos
            runner: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
            pattern: '*.dmg'
            asset: macos-arm64
          - os: macos
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
            pattern: '*.dmg'
            asset: macos-x86_64
          - os: linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: appimage
            pattern: '*.AppImage'
            asset: linux-x86_64
          - os: linux
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundle: appimage
            pattern: '*.AppImage'
            asset: linux-arm64

    defaults:
      run:
        working-directory: desktop
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # A tag that disagrees with the app version would ship a mislabelled release.
      - name: Check tag matches app version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match app version ${VERSION}"
            exit 1
          fi

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run tauri build -- --target "${{ matrix.target }}" --bundles "${{ matrix.bundle }}"

      # tauri.conf.json already ad-hoc signs the app bundle; the DMG needs its own pass.
      - name: Ad-hoc sign and verify DMG
        if: matrix.os == 'macos'
        run: |
          DMG="$(ls src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg | head -1)"
          codesign --force --sign - "${DMG}"
          hdiutil verify "${DMG}"

      # AppImage only runs when the executable bit survives the round trip.
      - name: Mark AppImage executable
        if: matrix.os == 'linux'
        run: chmod +x "src-tauri/target/${{ matrix.target }}/release/bundle/appimage"/*.AppImage

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/${{ matrix.pattern }}
          if-no-files-found: error

  package-mobile:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build mobile Docker image and tar packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          docker build -t newapi-app-mobile:"${VERSION}" -t newapi-app-mobile:latest ./mobile
          docker save newapi-app-mobile:"${VERSION}" | gzip > "dist/newapi-app-mobile-${VERSION}-docker.tar.gz"
          tar -czf "dist/newapi-app-mobile-${VERSION}-source.tar.gz" \
            --exclude='./mobile/node_modules' \
            --exclude='./mobile/android/.gradle' \
            --exclude='./mobile/ios/Pods' \
            --exclude='./.git' \
            -C . mobile

      - name: Upload mobile artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [build-desktop, package-mobile]
    runs-on: ubuntu-22.04
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-assets
          find . -type f -print0 | sort -z | xargs -0 sha256sum > ../checksums.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          mapfile -t ASSETS < <(find release-assets -type f | sort)
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ASSETS[@]}" checksums.txt --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" "${ASSETS[@]}" checksums.txt --repo "${GITHUB_REPOSITORY}" --title "${TAG}" --generate-notes
          fi
